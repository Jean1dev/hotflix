plugins {
    id 'java-conventions'
    id 'jacoco-report-aggregation'
    id 'application'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group 'com.fullcycle.catalogo.infrastructure'

bootJar {
    archiveFileName = 'application.jar'
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
}

ext {
    cache2k = "2.6.1.Final"
    springdoc = "2.8.17"
}
ext['mockito.version'] = '5.20.0'

dependencies {
    implementation(project(":domain"))
    implementation(project(":application"))

    implementation("com.google.guava:guava:33.0.0-jre")

    implementation("com.fasterxml.jackson.module:jackson-module-afterburner")

    implementation("io.github.resilience4j:resilience4j-spring-boot3")
    implementation("io.github.resilience4j:resilience4j-bulkhead")
    implementation("io.github.resilience4j:resilience4j-circuitbreaker")
    implementation("io.github.resilience4j:resilience4j-retry")

    implementation("org.cache2k:cache2k-api:$cache2k")
    implementation("org.cache2k:cache2k-spring:$cache2k")
    runtimeOnly("org.cache2k:cache2k-core:$cache2k")

    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdoc")

    implementation("org.springframework.boot:spring-boot-starter-web") {
        exclude module: 'spring-boot-starter-tomcat'
    }
    implementation("org.springframework.boot:spring-boot-starter-aop")
    implementation("org.springframework.boot:spring-boot-starter-cache")
    implementation("org.springframework.boot:spring-boot-starter-undertow")
    implementation("org.springframework.boot:spring-boot-starter-graphql")
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server")
    implementation("org.springframework.boot:spring-boot-starter-data-elasticsearch")
    implementation("org.springframework.cloud:spring-cloud-contract-wiremock")
    implementation("org.springframework.kafka:spring-kafka")

    testImplementation(project(path: ':domain', configuration: 'testClasses'))

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-testcontainers")
    testImplementation("org.springframework.graphql:spring-graphql-test")
    testImplementation("org.springframework.kafka:spring-kafka-test")
    testImplementation("org.springframework.security:spring-security-test")

    testImplementation("org.testcontainers:testcontainers:1.20.6")
    testImplementation("org.testcontainers:elasticsearch:1.20.6")
    testImplementation("org.testcontainers:kafka:1.20.6")
    testImplementation("org.testcontainers:junit-jupiter:1.20.6")
}

dependencyManagement {
    imports {
        mavenBom "io.github.resilience4j:resilience4j-bom:2.3.0"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
    }
}

testCodeCoverageReport {
    reports {
        xml.required = true
        xml.outputLocation = file("$rootDir/build/reports/jacoco/test/jacocoTestReport.xml")

        html.required = true
        html.outputLocation = file("$rootDir/build/reports/jacoco/test/")
    }
}

tasks.named("jacocoTestReport") {
    dependsOn tasks.named("testCodeCoverageReport", JacocoReport)
}
